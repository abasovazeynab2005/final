<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи для чата</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="logo-text">Jan-chai</h1>
    </header>

    <div id="main-screen">
        <h1 class="main-title">Выбери персонажа</h1>
        <div class="cards-container">
            <div class="card" data-character="kaiden">
                <img src="./images/kaiden.png" alt="Kaiden" class="card-image">
                <div class="card-info">
                    <div class="card-name">Kaiden</div>
                    <div class="card-desc">Заботливый одногруппник</div>
                </div>
            </div>
            <div class="card" data-character="vivien">
                <img src="./images/vivien.png" alt="Vivien" class="card-image">
                <div class="card-info">
                    <div class="card-name">Vivien</div>
                    <div class="card-desc">Холодная аристократка</div>
                </div>
            </div>
            <div class="card" data-character="soren">
                <img src="./images/soren.png" alt="Soren" class="card-image">
                <div class="card-info">
                    <div class="card-name">Soren</div>
                    <div class="card-desc">Суровый телохранитель</div>
                </div>
            </div>
            <div class="card" data-character="lilit">
                <img src="./images/lilit.png" alt="Lilit" class="card-image">
                <div class="card-info">
                    <div class="card-name">Lilit</div>
                    <div class="card-desc">Одинокая наследница</div>
                </div>
            </div>
            <div class="card" data-character="wade">
                <img src="./images/wade.png" alt="Wade" class="card-image">
                <div class="card-info">
                    <div class="card-name">Wade</div>
                    <div class="card-desc">Душа компании</div>
                </div>
            </div>
            <div class="card" data-character="sera">
                <img src="./images/sera.png" alt="Sera" class="card-image">
                <div class="card-info">
                    <div class="card-name">Sera</div>
                    <div class="card-desc">Завистливая особа</div>
                </div>
            </div>
            <div class="card" data-character="sabrina">
                <img src="./images/sabrina.png" alt="Sabrina" class="card-image">
                <div class="card-info">
                    <div class="card-name">Sabrina</div>
                    <div class="card-desc">Испуганная ведьма</div>
                </div>
            </div>
            <div class="card" data-character="luis">
                <img src="./images/luis.png" alt="Luis" class="card-image">
                <div class="card-info">
                    <div class="card-name">Luis</div>
                    <div class="card-desc">Застенчивый бариста</div>
                </div>
            </div>
        </div>
    </div>

    <div id="story-screen" style="display:none;">
        <div class="story-header">
            <button id="back-btn">← Назад к персонажам</button>
            <h2 id="character-name"></h2>
        </div>
        <div id="story-card"></div>
        <div id="choices-container"></div>
    </div>

    <footer>
        <h1>Interactive Chats. Choose your own Story</h1>
    </footer>

    <script src="scr.js"></script>
</body>
</html>
